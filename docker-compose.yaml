services:
  postgres:
    image: postgres:alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=group_n_meet
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - ./postgresql/.postgres-data:/var/lib/postgresql/:rw

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=group_n_meet
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - BIND_ADDRESS=0.0.0.0
    depends_on:
      - postgres
    develop:
      watch:
        - action: rebuild
          path: ./src
